[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "untappd"
version = "0.1.0"
dependencies = [
    "colour",
    "folium",
    "geopy",
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
    "wordcloud",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["filecached", "untappd", "untappd_categorise", "untappd_utils"]
